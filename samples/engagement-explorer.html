<style>
  .ee { padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 16px; font-size: 13px; }
  .ee * { box-sizing: border-box; }
  .ee h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .ee .muted { color: var(--muted-foreground); }
  .ee .mono { font-family: var(--font-mono, ui-monospace, monospace); font-variant-numeric: tabular-nums; }
  .ee .row { display: grid; gap: 12px; }
  .ee .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .ee .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .ee .kpi .l { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .08em; }
  .ee .kpi .v { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .ee .kpi .d { font-size: 11px; color: var(--muted-foreground); }
  .ee .kpi .d.up { color: var(--rl-good); } .ee .kpi .d.down { color: var(--rl-bad); }
  .ee .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .ee .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 18px; align-items: end; }
  .ee label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .06em; }
  .ee label b { color: var(--foreground); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .ee input[type=range] { width: 100%; accent-color: var(--rl-1); }
  .ee input[type=text], .ee select { height: 30px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); border-radius: 6px; padding: 0 8px; font: inherit; font-size: 13px; }
  .ee .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .ee .seg button { border: 0; background: transparent; color: var(--muted-foreground); padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .ee .seg button.on { background: var(--primary); color: var(--primary-foreground); }
  .ee .check { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--foreground); }
  .ee .two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  @media (max-width: 860px) { .ee .two { grid-template-columns: 1fr; } }
  .ee svg text { fill: var(--muted-foreground); font-size: 11px; }
  .ee .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted-foreground); margin-bottom: 6px; flex-wrap: wrap; }
  .ee .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .ee .meter { height: 10px; border-radius: 5px; background: var(--muted); overflow: hidden; margin-top: 8px; }
  .ee .meter i { display: block; height: 100%; background: var(--rl-1); border-radius: 5px; transition: width .25s; }
  .ee table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ee th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .ee td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .ee td.n { text-align: right; }
  .ee .thumb { width: 36px; height: 36px; border-radius: 4px; background: var(--muted); object-fit: cover; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .ee .thumb.ph { display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 10px; }
  .ee .bar { height: 8px; border-radius: 4px; background: var(--rl-1); }
  .ee .barwrap { width: 120px; background: var(--muted); border-radius: 4px; display: inline-block; vertical-align: middle; margin-left: 8px; }
  .ee a { color: inherit; text-decoration: none; } .ee a:hover { text-decoration: underline; }
  .ee .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 11px; box-shadow: 0 4px 12px rgba(0,0,0,.12); display: none; }
  .ee .foot { font-size: 11px; color: var(--muted-foreground); display: flex; gap: 12px; flex-wrap: wrap; }
  .ee .empty { color: var(--muted-foreground); padding: 20px 0; text-align: center; }
</style>

<div class="ee">
  <div class="row kpis" id="kpis"></div>

  <div class="card">
    <h2>Explore</h2>
    <div class="controls">
      <label>Rank by
        <span class="seg" id="metricSeg">
          <button data-m="views" class="on">Views</button>
          <button data-m="downloads">Downloads</button>
        </span>
      </label>
      <label>Top <b id="topNLabel">15</b> assets<input type="range" id="topN" min="5" max="50" step="1" value="15"></label>
      <label>Minimum count <b id="minLabel">1</b><input type="range" id="minCount" min="0" max="50" step="1" value="1"></label>
      <label>Trend smoothing <b id="smoothLabel">1 bucket</b><input type="range" id="smooth" min="1" max="7" step="1" value="1"></label>
      <label>Filter titles<input type="text" id="filter" placeholder="e.g. banner, logo, .mp4"></label>
      <label class="check"><input type="checkbox" id="previewsOnly"> Only assets with a preview</label>
    </div>
  </div>

  <div class="row two">
    <div class="card" style="position:relative">
      <h2>Engagement over time</h2>
      <div class="legend"><span><i style="background:var(--rl-1)"></i>Views</span><span><i style="background:var(--rl-2)"></i>Downloads</span><span><i style="background:var(--rl-4)"></i>Plays</span></div>
      <div id="trend"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="card">
      <h2>Concentration</h2>
      <div class="muted" id="concText">Share of all activity held by the top assets.</div>
      <div class="meter"><i id="concBar" style="width:0%"></i></div>
      <div class="mono muted" style="margin-top:6px" id="concNum"></div>
      <h2 style="margin-top:18px">Most active users</h2>
      <div id="users"></div>
    </div>
  </div>

  <div class="card">
    <h2 id="assetsTitle">Top assets</h2>
    <div id="assets"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { metric: 'views', topN: 15, minCount: 1, smooth: 1, filter: '', previewsOnly: false };
  var D = null;

  function fmt(n) { n = Number(n || 0); if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K'; return Math.round(n).toLocaleString(); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bucket(row, dim) { return String(row[dim + '.day'] || row[dim + '.week'] || row[dim + '.month'] || row[dim] || '').slice(0, 10); }
  function rows(id) { var r = D && D.results[id]; return r && r.rows ? r.rows : []; }
  function count(id) { var r = D && D.results[id]; return r && typeof r.count === 'number' ? r.count : null; }
  function fmtDate(d, g) { var x = new Date(d + 'T00:00:00Z'); if (!isFinite(x)) return d; return g === 'month' ? x.toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' }) : x.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' }); }

  // ── Series ────────────────────────────────────────────────────────────
  function trend() {
    var v = {}, d = {}, p = {};
    rows('trend_views').forEach(function (r) { var k = bucket(r, 'DateDimension.date'); if (k) v[k] = (v[k] || 0) + num(r['Views.count']); });
    rows('trend_downloads').forEach(function (r) { var k = bucket(r, 'Downloads.downloadDate'); if (k) d[k] = (d[k] || 0) + num(r['Downloads.count']); });
    rows('trend_plays').forEach(function (r) { var k = bucket(r, 'PreviewPlaybacks.previewPlaybackDate'); if (k) p[k] = (p[k] || 0) + num(r['PreviewPlaybacks.count']); });
    var keys = Object.keys(Object.assign({}, v, d, p)).sort();
    return keys.map(function (k) { return { date: k, views: v[k] || 0, downloads: d[k] || 0, plays: p[k] || 0 }; });
  }
  function smoothSeries(arr, key, w) {
    if (w <= 1) return arr.map(function (x) { return x[key]; });
    return arr.map(function (_, i) { var s = 0, n = 0; for (var j = Math.max(0, i - w + 1); j <= i; j++) { s += arr[j][key]; n++; } return s / n; });
  }
  function assets() {
    var id = state.metric === 'views' ? 'top_views' : 'top_downloads';
    var dim = state.metric === 'views' ? 'Views.recordId' : 'Downloads.recordId';
    var m = state.metric === 'views' ? 'Views.count' : 'Downloads.count';
    return rows(id).map(function (r) { return { id: String(r[dim] || ''), title: r._title || null, thumb: r._thumbnail || null, link: r._link || null, type: r._contentType || '', unavailable: r._unavailable || null, count: num(r[m]) }; }).filter(function (a) { return a.id; });
  }
  function users() {
    var id = state.metric === 'views' ? 'users_views' : 'users_downloads';
    var m = state.metric === 'views' ? 'Views.count' : 'Downloads.count';
    return rows(id).map(function (r) { return { user: String(r['Users.loginId'] || ''), count: num(r[m]) }; }).filter(function (u) { return u.user; }).sort(function (a, b) { return b.count - a.count; });
  }

  // ── Renderers ─────────────────────────────────────────────────────────
  function renderKpis(t) {
    var views = t.reduce(function (s, x) { return s + x.views; }, 0), downloads = t.reduce(function (s, x) { return s + x.downloads; }, 0), plays = t.reduce(function (s, x) { return s + x.plays; }, 0);
    var pv = num((rows('prior_views')[0] || {})['Views.count']), pd = num((rows('prior_downloads')[0] || {})['Downloads.count']);
    var uv = {}; rows('users_views').forEach(function (r) { if (r['Users.loginId']) uv[r['Users.loginId']] = 1; }); rows('users_downloads').forEach(function (r) { if (r['Users.loginId']) uv[r['Users.loginId']] = 1; });
    var lib = count('library_total'), files = count('library_files');
    function delta(cur, prev) { if (prev === 0) return cur === 0 ? { t: 'no change', c: '' } : { t: 'new', c: 'up' }; var p = (cur - prev) / prev * 100; return { t: (p > 0 ? '+' : '') + p.toFixed(1) + '% vs prior period', c: p > 0.5 ? 'up' : p < -0.5 ? 'down' : '' }; }
    var dv = delta(views, pv), dd = delta(downloads, pd);
    $('kpis').innerHTML = [
      ['Views', fmt(views), dv.t, dv.c], ['Downloads', fmt(downloads), dd.t, dd.c], ['Plays', fmt(plays), 'preview playbacks', ''],
      ['Active users', fmt(Object.keys(uv).length), 'viewed or downloaded', ''],
      ['Library', lib == null ? '–' : fmt(lib), files == null ? 'records' : fmt(files) + ' with files', '']
    ].map(function (k) { return '<div class="kpi"><span class="l">' + k[0] + '</span><span class="v mono">' + k[1] + '</span><span class="d ' + k[3] + '">' + k[2] + '</span></div>'; }).join('');
  }

  function renderTrend(t) {
    var el = $('trend');
    if (!t.length) { el.innerHTML = '<div class="empty">No activity in this range.</div>'; return; }
    var W = Math.max(320, el.clientWidth || 600), H = 220, L = 40, R = 10, T = 10, B = 26;
    var g = D.granularity;
    var series = [['views', 'var(--rl-1)'], ['downloads', 'var(--rl-2)'], ['plays', 'var(--rl-4)']].map(function (s) { return { key: s[0], color: s[1], vals: smoothSeries(t, s[0], state.smooth) }; });
    var max = Math.max(1, Math.max.apply(null, series.map(function (s) { return Math.max.apply(null, s.vals); })));
    var x = function (i) { return L + (t.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (t.length - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var ticks = 4, grid = '';
    for (var i = 0; i <= ticks; i++) { var v = max * i / ticks, yy = y(v); grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--rl-grid)"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + fmt(v) + '</text>'; }
    var step = Math.max(1, Math.ceil(t.length / Math.floor((W - L - R) / 70)));
    var xl = t.map(function (p, i) { return i % step === 0 ? '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(fmtDate(p.date, g)) + '</text>' : ''; }).join('');
    var paths = series.map(function (s) { var d = s.vals.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' '); return '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"/>'; }).join('');
    el.innerHTML = '<svg width="' + W + '" height="' + H + '" style="display:block;max-width:100%">' + grid + xl + paths + '<line id="cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--rl-muted)" stroke-width="1" style="display:none"/></svg>';
    var svg = el.firstChild, cross = svg.querySelector('#cross'), tip = $('tip');
    svg.onmousemove = function (e) {
      var rect = svg.getBoundingClientRect(), px = e.clientX - rect.left;
      var i = Math.round((px - L) / ((W - L - R) / Math.max(1, t.length - 1))); i = Math.max(0, Math.min(t.length - 1, i));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.display = '';
      tip.style.display = 'block'; tip.style.left = Math.min(px + 12, W - 140) + 'px'; tip.style.top = (e.clientY - rect.top + 40) + 'px';
      tip.innerHTML = '<b>' + esc(fmtDate(t[i].date, g)) + '</b><br>Views ' + fmt(t[i].views) + '<br>Downloads ' + fmt(t[i].downloads) + '<br>Plays ' + fmt(t[i].plays) + (state.smooth > 1 ? '<br><span class="muted">smoothed ' + state.smooth + '</span>' : '');
    };
    svg.onmouseleave = function () { cross.style.display = 'none'; tip.style.display = 'none'; };
  }

  function renderAssets(t) {
    var all = assets(), total = all.reduce(function (s, a) { return s + a.count; }, 0);
    var periodTotal = t.reduce(function (s, x) { return s + (state.metric === 'views' ? x.views : x.downloads); }, 0) || total;
    var q = state.filter.trim().toLowerCase();
    var list = all.filter(function (a) { return a.count >= state.minCount; })
      .filter(function (a) { return !q || (a.title || a.id).toLowerCase().indexOf(q) >= 0; })
      .filter(function (a) { return !state.previewsOnly || !!a.thumb; })
      .slice(0, state.topN);
    var top = list.reduce(function (s, a) { return s + a.count; }, 0);
    var share = periodTotal ? Math.min(100, top / periodTotal * 100) : 0;
    $('concBar').style.width = share.toFixed(1) + '%';
    $('concNum').textContent = fmt(top) + ' of ' + fmt(periodTotal) + ' ' + state.metric + ' · ' + share.toFixed(1) + '%';
    $('concText').textContent = 'Share of all ' + state.metric + ' in the period held by the ' + list.length + ' assets shown below.';
    $('assetsTitle').textContent = 'Top ' + list.length + ' assets by ' + state.metric + (q ? ' matching "' + state.filter.trim() + '"' : '');
    if (!list.length) { $('assets').innerHTML = '<div class="empty">No assets match the current controls.</div>'; return; }
    var max = list[0].count;
    $('assets').innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Asset</th><th>Type</th><th style="text-align:right">' + esc(state.metric) + '</th><th>Share</th></tr></thead><tbody>' + list.map(function (a, i) {
      var label = a.title ? esc(a.title) : '<span class="mono muted">' + esc(a.id.slice(0, 8)) + '…</span>' + (a.unavailable ? ' <span class="muted">(' + esc(a.unavailable) + ')</span>' : '');
      var thumb = a.thumb ? '<img class="thumb" src="' + esc(a.thumb) + '" alt="">' : '<span class="thumb ph">–</span>';
      var cell = a.link ? '<a href="' + esc(a.link) + '" target="_blank" rel="noopener">' + thumb + label + '</a>' : thumb + label;
      return '<tr><td class="muted">' + (i + 1) + '</td><td>' + cell + '</td><td class="muted">' + esc(a.type) + '</td><td class="n mono">' + fmt(a.count) + '</td><td><span class="mono">' + (periodTotal ? (a.count / periodTotal * 100).toFixed(1) : '0.0') + '%</span><span class="barwrap"><span class="bar" style="width:' + Math.max(2, a.count / max * 100) + '%"></span></span></td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function renderUsers() {
    var u = users().slice(0, 10);
    if (!u.length) { $('users').innerHTML = '<div class="empty">No user activity.</div>'; return; }
    var max = u[0].count;
    $('users').innerHTML = u.map(function (x) { return '<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span class="mono" style="width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px" title="' + esc(x.user) + '">' + esc(x.user) + '</span><span style="flex:1;background:var(--muted);border-radius:4px;height:8px"><span style="display:block;height:8px;border-radius:4px;background:var(--rl-5);width:' + Math.max(2, x.count / max * 100) + '%"></span></span><span class="mono" style="width:44px;text-align:right">' + fmt(x.count) + '</span></div>'; }).join('');
  }

  function renderFoot() {
    var failed = Object.keys(D.results).filter(function (k) { return D.results[k].error; });
    $('foot').innerHTML = '<span>Range ' + esc(D.range ? D.range[0] + ' to ' + D.range[1] : 'all time') + ' · ' + esc(D.granularity) + ' buckets</span><span>Refreshed ' + esc(new Date(D.refreshedAt).toLocaleString()) + '</span><span>' + esc(D.environment) + '.dam.aprimo.com</span>' + (failed.length ? '<span style="color:var(--rl-bad)">' + failed.length + ' query error(s): ' + esc(failed.join(', ')) + '</span>' : '');
  }

  function render() {
    if (!D) return;
    var t = trend();
    renderKpis(t); renderTrend(t); renderAssets(t); renderUsers(); renderFoot();
  }

  // ── Controls ──────────────────────────────────────────────────────────
  $('metricSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.metric = b.getAttribute('data-m'); Array.prototype.forEach.call($('metricSeg').children, function (c) { c.classList.toggle('on', c === b); }); render(); });
  $('topN').addEventListener('input', function (e) { state.topN = +e.target.value; $('topNLabel').textContent = state.topN; renderAssets(trend()); });
  $('minCount').addEventListener('input', function (e) { state.minCount = +e.target.value; $('minLabel').textContent = state.minCount; renderAssets(trend()); });
  $('smooth').addEventListener('input', function (e) { state.smooth = +e.target.value; $('smoothLabel').textContent = state.smooth + (state.smooth === 1 ? ' bucket' : ' buckets'); renderTrend(trend()); });
  $('filter').addEventListener('input', function (e) { state.filter = e.target.value; renderAssets(trend()); });
  $('previewsOnly').addEventListener('change', function (e) { state.previewsOnly = e.target.checked; renderAssets(trend()); });
  window.addEventListener('resize', function () { if (D) renderTrend(trend()); });

  $('kpis').innerHTML = '<div class="kpi"><span class="l">Loading</span><span class="v muted">…</span><span class="d">Running queries against Aprimo</span></div>';
  window.ReportLabs.onData(function (payload) {
    D = payload;
    var a = assets(); var maxC = a.length ? Math.max.apply(null, a.map(function (x) { return x.count; })) : 50;
    $('minCount').max = Math.max(1, Math.min(500, maxC));
    render();
  });
})();
</script>
